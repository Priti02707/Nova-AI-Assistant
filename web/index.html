<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Try Nova's everyday commands using text or your browser microphone.">
  <title>Nova AI Assistant</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main>
    <p class="eyebrow">Browser demo</p>
    <h1>Nova AI Assistant</h1>
    <p class="intro">Ask for the time, search Wikipedia, find a video, or hear a joke.</p>
    <section class="panel" aria-label="Command">
      <form id="command-form">
        <label for="command">Your command</label>
        <input id="command" placeholder="What time is it?" maxlength="240" required autocomplete="off">
        <div class="actions">
          <button>Run command</button>
          <button type="button" id="microphone" class="secondary" hidden>Use microphone</button>
        </div>
      </form>
      <p class="note" id="voice-status" role="status"></p>
      <div class="actions" aria-label="Example commands">
        <button type="button" class="secondary" data-command="What time is it?">Time</button>
        <button type="button" class="secondary" data-command="Search Wikipedia for machine learning">Wikipedia</button>
        <button type="button" class="secondary" data-command="Tell me a joke">Joke</button>
      </div>
    </section>
    <section class="panel" aria-labelledby="reply-title">
      <h2 id="reply-title">Nova’s reply</h2>
      <p id="reply" role="status">Your reply will appear here.</p>
      <div class="actions">
        <a id="result-link" target="_blank" rel="noopener noreferrer" hidden></a>
        <button type="button" id="speak" class="secondary" hidden>Read aloud</button>
      </div>
    </section>
    <p class="note">Typing works without a microphone. Voice recognition depends on your browser and may send audio to its speech service.</p>
  </main>
</body>
</html>
